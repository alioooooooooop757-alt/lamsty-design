<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لمستي للتصميم</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f8f0ff;
      color: #444;
    }

    header {
      padding: 50px 20px;
      background: white;
    }

    h1 {
      color: #8e44ad;
      font-size: 42px;
      margin-bottom: 15px;
    }

    header p {
      font-size: 20px;
      line-height: 1.8;
    }

    button,
    .tiktok-link {
      display: inline-block;
      margin: 10px 5px;
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 10px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    button {
      background: #8e44ad;
      color: white;
    }

    button:hover {
      background: #6c3483;
    }

    .tiktok-link {
      background: #111;
      color: white;
    }

    section {
      padding: 35px 20px;
    }

    h2 {
      color: #6c3483;
      font-size: 30px;
      margin-bottom: 25px;
    }

    .services {
      max-width: 700px;
      margin: auto;
    }

    .service {
      background: white;
      margin: 12px auto;
      padding: 18px;
      border-radius: 12px;
      font-size: 19px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    footer {
      padding: 25px;
      background: #6c3483;
      color: white;
      margin-top: 20px;
    }
@keyframes دخول {
from { opacity: 0; transform: translateY(30px); }
to { opacity: 1; transform: translateY(0); }
}

header {
animation: دخول 1s ease-out;
}

.service {
transition: transform 0.3s ease;
}

.service:active {
transform: scale(0.96);
}

button {
transition: transform 0.2s ease;
}

button:active {
transform: scale(0.94);
      }  </style>
</head>

<body>

  <header>
    <h1>لمستي للتصميم</h1>

    <p>نحوّل فكرتك إلى تصميم يجذب الأنظار ✨</p>

    <button onclick="showMessage()">اطلب تصميمك الآن</button>

    <a class="tiktok-link"
       href="https://www.tiktok.com/@al_9773"
       target="_blank">
      🎵 تابعنا على TikTok
    </a>
  </header>

  <section>
    <h2>خدماتنا</h2>

    <div class="services">
      <div class="service">🎨 تصميم بوستات للسوشيال ميديا</div>

      <div class="service">📢 تصميم الإعلانات</div>

      <div class="service">📚 تصميم أغلفة الكتب</div>

      <div class="service">🛍️ تصميم منشورات للمحلات</div>
    </div>
  </section>

  <footer>
    © 2026 لمستي للتصميم
  </footer>

  <script>
    function showMessage() {
      alert("أهلاً بك 🌷 للطلب والاستفسار راسلنا على TikTok: @al_9773");
    }
  </script>

</body>
</html>
